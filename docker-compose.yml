services:
  app:
    build: .
    image: zackboing:0.1.0-dev
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      ZACKBOING_DATA: /data
      ZACKBOING_PUBLIC_URL: ${ZACKBOING_PUBLIC_URL:-}
      ZACKBOING_PROXY_IPS: ${ZACKBOING_PROXY_IPS:-127.0.0.1,::1}
    volumes:
      - data:/data
    ports: ["127.0.0.1:${ZACKBOING_PORT:-3100}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  data:
