# Zackboing hinter nginx – nach /etc/nginx/sites-available/zackboing kopieren,
# Domain anpassen, verlinken, dann: certbot --nginx -d zackboing.gsndk.de
server {
    listen 80;
    listen [::]:80;
    server_name zackboing.gsndk.de;

    # Uploads bis 25 MB (Bild/Audio/Video pro Frage)
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # WebSocket (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Lange Spiele: Verbindung nicht vorzeitig kappen
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
